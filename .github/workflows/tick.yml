name: Background tick

# Vercel's free plan runs crons once a day; this pings the app every 10 minutes
# so reconciliation, retries and recovery e-mails run close to real time.
# Needs repository secrets APP_URL (e.g. https://whop-chekout.vercel.app) and CRON_SECRET.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/cron/tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret not set, skipping"; exit 0; fi
          curl -fsS --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/tick"
